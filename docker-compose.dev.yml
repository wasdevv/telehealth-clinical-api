# Just the datastores, for working on the app locally with `bin/rails server`.
# The whole service in containers is docker-compose.standalone.yml.
#
# Host ports default high on purpose: 5432 and 6379 are very often already taken by
# another project, and a Rails app that quietly connects to somebody else's Redis is a
# bad afternoon. Override with POSTGRES_PORT / REDIS_PORT if you want the usual ones.
name: telehealth-clinical-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-dev:
  redis-dev:
