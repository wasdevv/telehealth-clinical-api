# Local and CI runs point at PostgreSQL with the POSTGRES_* variables below, so the
# test database name never gets overwritten by a stray DATABASE_URL. Production (and
# anything else that hands us one connection string) uses DATABASE_URL.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  <<: *default
  database: telehealth_clinical_api_development

test:
  <<: *default
  database: telehealth_clinical_api_test

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", nil) %>
