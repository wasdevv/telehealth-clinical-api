name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/0
      # Test-only values. Real deployments read these from their own secret store.
      SECRET_KEY_BASE: ci-secret-key-base-not-used-anywhere-else
      DEVISE_JWT_SECRET_KEY: ci-jwt-secret-not-used-anywhere-else
      DJANGO_BILLING_URL: http://billing.test
      INTERNAL_SERVICE_TOKEN: ci-internal-token

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.4"
          bundler-cache: true

      - name: Load the schema
        run: bin/rails db:create db:schema:load

      - name: Specs
        run: bundle exec rspec

      - name: RuboCop
        run: bundle exec rubocop --parallel

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only. Publishing needs a registry and credentials this repository does not
      # assume; what CI proves here is that the production image still builds.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
